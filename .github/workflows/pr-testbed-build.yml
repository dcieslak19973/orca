name: PR Testbed Build (Windows)

# Why: the canonical release pipeline (release-cut.yml) is gated to
# stablyai/orca and depends on SignPath secrets a fork does not have. This
# workflow exists only on the integration branch in a fork so an unsigned
# Windows build of a stack of PRs can be produced and downloaded on another
# machine. It never publishes to the upstream repo.
#
# Requires Actions to be enabled on the fork (one-time confirmation at
# https://github.com/<fork>/actions) before it can be dispatched.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish assets under (default pr-testbed-<run number>)
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: pr-testbed-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Why: unsigned testbed artifacts must never appear as releases on the
    # canonical repo.
    if: github.repository != 'stablyai/orca'
    # windows-2022: windows-latest moved to VS 2026, which node-gyp cannot
    # detect for the native dependency rebuild.
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag and build version
        id: plan
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-pr-testbed-${RUN_NUMBER}}"
          base="$(node -p "require('./package.json').version")"
          # electron-builder requires semver; keep the prerelease id alnum.
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "version=${base}-prtestbed.${RUN_NUMBER}" >>"$GITHUB_OUTPUT"

      # pnpm must precede setup-node so the store cache can be located.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Cache electron-builder downloads
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-builder-win-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 30
          command: pnpm install --frozen-lockfile

      # No ORCA_BUILD_IDENTITY / PostHog key: testbed builds must stay
      # unofficial so telemetry stays disabled at the transport gate.
      - name: Build app
        run: pnpm build:release
        env:
          ORCA_LOCAL_BUILD_VERSION: ${{ steps.plan.outputs.version }}

      - name: Package installer and portable zip
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 40
          max_attempts: 2
          retry_wait_seconds: 30
          command: node config/scripts/ensure-native-runtime.mjs --runtime=electron; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }; pnpm exec electron-builder --config config/electron-builder.config.cjs --win nsis zip --publish never
        env:
          ORCA_LOCAL_BUILD_VERSION: ${{ steps.plan.outputs.version }}

      - name: Verify Windows node-pty ConPTY runtime
        shell: pwsh
        run: |
          $runtimeDir = 'dist/win-unpacked/resources/node_modules/node-pty/build/Release'
          foreach ($file in @("$runtimeDir/conpty.node", "$runtimeDir/conpty/conpty.dll", "$runtimeDir/conpty/OpenConsole.exe")) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing Windows node-pty runtime file: $file"
            }
          }

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          shopt -s nullglob
          for f in dist/*.exe dist/*.zip; do
            cp "$f" upload/
          done
          ls -la upload
          test -n "$(ls -A upload)"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: orca-testbed-win
          path: upload/*
          retention-days: 14

      - name: Attach artifacts to a prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$SHA" \
              --title "PR testbed $VERSION" \
              --prerelease \
              --notes "Unsigned Windows test build of the PR integration branch at \`$SHA\`. Not an official Orca release: no code signing, no telemetry identity, no auto-update channel."
          fi
          gh release upload "$TAG" upload/* --clobber
